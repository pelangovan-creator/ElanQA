name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright (test runs and PDF export)
        run: npx playwright install --with-deps chromium
        working-directory: apps/api
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API, web and demo images
        run: |
          docker build -f apps/api/Dockerfile -t qapilot-api .
          docker build -f apps/web/Dockerfile -t qapilot-web .
          docker build -f apps/demo/Dockerfile -t qapilot-demo .
