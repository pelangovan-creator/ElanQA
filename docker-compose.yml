# Production-like stack: PostgreSQL + API + web (nginx). Usage:
#   cp .env.example .env   # set JWT_SECRET and ENCRYPTION_KEY
#   docker compose up --build   -> http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qapilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qapilot}
      POSTGRES_DB: qapilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qapilot"]
      interval: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qapilot:${POSTGRES_PASSWORD:-qapilot}@db:5432/qapilot
      CORS_ORIGIN: http://localhost:8080
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
  storage:
